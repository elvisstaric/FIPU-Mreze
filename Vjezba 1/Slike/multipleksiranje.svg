<svg xmlns="http://www.w3.org/2000/svg" width="970" height="465" viewBox="0 0 970 465" role="img" aria-labelledby="title desc"><title id="title">Vremensko i frekvencijsko multipleksiranje</title><desc id="desc">TDM prikazuje šest polja A B C A B C na osi vremena; FDM tri odvojena frekvencijska pojasa A B C.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#287a91"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" font-size="18" fill="#071b50"><text x="25" y="34" font-size="23" font-weight="bold">TDM — podjela vremena</text><rect x="65" y="70" width="130" height="65" rx="5" fill="#d9edf5" stroke="#287a91"/><text x="130" y="111" text-anchor="middle" font-size="24" font-weight="bold">A</text><rect x="205" y="70" width="130" height="65" rx="5" fill="#b7dfd5" stroke="#287a91"/><text x="270" y="111" text-anchor="middle" font-size="24" font-weight="bold">B</text><rect x="345" y="70" width="130" height="65" rx="5" fill="#f0dfb5" stroke="#287a91"/><text x="410" y="111" text-anchor="middle" font-size="24" font-weight="bold">C</text><rect x="485" y="70" width="130" height="65" rx="5" fill="#d9edf5" stroke="#287a91"/><text x="550" y="111" text-anchor="middle" font-size="24" font-weight="bold">A</text><rect x="625" y="70" width="130" height="65" rx="5" fill="#b7dfd5" stroke="#287a91"/><text x="690" y="111" text-anchor="middle" font-size="24" font-weight="bold">B</text><rect x="765" y="70" width="130" height="65" rx="5" fill="#f0dfb5" stroke="#287a91"/><text x="830" y="111" text-anchor="middle" font-size="24" font-weight="bold">C</text><line x1="65" y1="154" x2="915" y2="154" stroke="#287a91" stroke-width="2" marker-end="url(#arrow)"/><text x="790" y="182" >vrijeme</text><text x="65" y="207" font-size="17">Sudionici se izmjenjuju u vremenskim odsječcima.</text><text x="25" y="260" font-size="23" font-weight="bold">FDM — podjela frekvencija</text><rect x="65" y="295" width="245" height="65" rx="5" fill="#d9edf5" stroke="#287a91"/><text x="187" y="336" text-anchor="middle" font-size="24" font-weight="bold">A</text><rect x="345" y="295" width="245" height="65" rx="5" fill="#b7dfd5" stroke="#287a91"/><text x="467" y="336" text-anchor="middle" font-size="24" font-weight="bold">B</text><rect x="625" y="295" width="245" height="65" rx="5" fill="#f0dfb5" stroke="#287a91"/><text x="747" y="336" text-anchor="middle" font-size="24" font-weight="bold">C</text><line x1="65" y1="379" x2="915" y2="379" stroke="#287a91" stroke-width="2" marker-end="url(#arrow)"/><text x="760" y="405" >frekvencija</text><text x="65" y="435" font-size="17">Odvojeni pojasevi mogu se koristiti istodobno; između njih su zaštitni razmaci.</text></g></svg>
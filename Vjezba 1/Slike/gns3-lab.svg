<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="290" viewBox="0 0 1000 290" role="img" aria-labelledby="title desc"><title id="title">GNS3 laboratorij</title><desc id="desc">PC1 preko SW1 komunicira s PC2. Filtar je samo na vezi SW1–PC2.</desc><rect width="1000" height="290" fill="white"/><g font-family="Arial,sans-serif" text-anchor="middle" fill="#071b50"><path d="M220 115 H420 M580 115 H780" stroke="#287a91" stroke-width="5"/><rect x="40" y="60" width="180" height="110" rx="12" fill="#d9edf5" stroke="#287a91"/><rect x="420" y="60" width="160" height="110" rx="12" fill="#b7dfd5" stroke="#287a91"/><rect x="780" y="60" width="180" height="110" rx="12" fill="#d9edf5" stroke="#287a91"/><text x="130" y="110" font-size="25" font-weight="bold">PC1</text><text x="130" y="145" font-size="19">VPCS</text><text x="500" y="110" font-size="25" font-weight="bold">SW1</text><text x="500" y="145" font-size="17">Ethernet switch</text><text x="870" y="110" font-size="25" font-weight="bold">PC2</text><text x="870" y="145" font-size="19">VPCS</text><text x="130" y="208" font-size="20">192.168.10.1/24</text><text x="870" y="208" font-size="20">192.168.10.2/24</text><text x="320" y="94" font-size="17">veza bez filtra</text><text x="680" y="45" font-size="17">ovdje dodajemo filtar</text><path d="M680 55 V103" stroke="#a86020" stroke-width="2"/><circle cx="680" cy="115" r="10" fill="#f0dfb5" stroke="#a86020" stroke-width="2"/><text x="500" y="263" font-size="18">Oba računala i preklopnik na istom lokalnom poslužitelju.</text></g></svg>
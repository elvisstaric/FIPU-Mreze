<svg xmlns="http://www.w3.org/2000/svg" width="970" height="335" viewBox="0 0 970 335" role="img" aria-labelledby="title desc"><title id="title">Dvorazinski signal za niz 10110010</title><desc id="desc">Svako polje predstavlja jedan bit, uz razine visoka za 1 i niska za 0.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#287a91"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" font-size="18" fill="#071b50"><text x="25" y="32" font-size="22" font-weight="bold">Signal prema pravilu: viša razina = 1, niža = 0</text><rect x="120" y="65" width="95" height="165" fill="#d9edf5"/><text x="167.5" y="94" text-anchor="middle" font-weight="bold" font-size="24">1</text><line x1="120" y1="115" x2="120" y2="235" stroke="#a2b1bd" stroke-dasharray="4 4"/><rect x="215" y="65" width="95" height="165" fill="#f5f8fa"/><text x="262.5" y="94" text-anchor="middle" font-weight="bold" font-size="24">0</text><line x1="215" y1="115" x2="215" y2="235" stroke="#a2b1bd" stroke-dasharray="4 4"/><rect x="310" y="65" width="95" height="165" fill="#d9edf5"/><text x="357.5" y="94" text-anchor="middle" font-weight="bold" font-size="24">1</text><line x1="310" y1="115" x2="310" y2="235" stroke="#a2b1bd" stroke-dasharray="4 4"/><rect x="405" y="65" width="95" height="165" fill="#f5f8fa"/><text x="452.5" y="94" text-anchor="middle" font-weight="bold" font-size="24">1</text><line x1="405" y1="115" x2="405" y2="235" stroke="#a2b1bd" stroke-dasharray="4 4"/><rect x="500" y="65" width="95" height="165" fill="#d9edf5"/><text x="547.5" y="94" text-anchor="middle" font-weight="bold" font-size="24">0</text><line x1="500" y1="115" x2="500" y2="235" stroke="#a2b1bd" stroke-dasharray="4 4"/><rect x="595" y="65" width="95" height="165" fill="#f5f8fa"/><text x="642.5" y="94" text-anchor="middle" font-weight="bold" font-size="24">0</text><line x1="595" y1="115" x2="595" y2="235" stroke="#a2b1bd" stroke-dasharray="4 4"/><rect x="690" y="65" width="95" height="165" fill="#d9edf5"/><text x="737.5" y="94" text-anchor="middle" font-weight="bold" font-size="24">1</text><line x1="690" y1="115" x2="690" y2="235" stroke="#a2b1bd" stroke-dasharray="4 4"/><rect x="785" y="65" width="95" height="165" fill="#f5f8fa"/><text x="832.5" y="94" text-anchor="middle" font-weight="bold" font-size="24">0</text><line x1="785" y1="115" x2="785" y2="235" stroke="#a2b1bd" stroke-dasharray="4 4"/><polyline points="120,135 215,135 215,205 310,205 310,135 405,135 405,135 500,135 500,205 595,205 595,205 690,205 690,135 785,135 785,205 880,205" fill="none" stroke="#287a91" stroke-width="4"/><text x="20" y="141" >viša razina</text><text x="20" y="211" >niža razina</text><line x1="120" y1="254" x2="900" y2="254" stroke="#287a91" stroke-width="2" marker-end="url(#arrow)"/><text x="795" y="279" >vrijeme</text><text x="25" y="308" font-size="16">Jedno polje = jedan bit u ovom primjeru; prikaz ne predstavlja određeni Ethernet standard.</text></g></svg>
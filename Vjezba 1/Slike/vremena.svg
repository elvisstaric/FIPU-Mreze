<svg xmlns="http://www.w3.org/2000/svg" width="1020" height="385" viewBox="0 0 1020 385" role="img" aria-labelledby="title desc"><title id="title">Vrijeme slanja i vrijeme širenja</title><desc id="desc">Na dvjema vremenskim osima prvi bit kreće u 0, posljednji u t_sl. Dolasci su pomaknuti za t_š.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10Z" fill="#287a91"/></marker></defs><rect width="100%" height="100%" fill="white"/><g font-family="Arial, sans-serif" font-size="18" fill="#071b50"><text x="30" y="35" font-size="24" font-weight="bold">Slanje i širenje na jednoj vezi</text><text x="80" y="77" >Pošiljatelj</text><text x="700" y="77" >Primatelj</text><line x1="130" y1="90" x2="130" y2="320" stroke="#071b50" stroke-width="2"/><line x1="750" y1="90" x2="750" y2="320" stroke="#071b50" stroke-width="2"/><line x1="130" y1="115" x2="750" y2="170" stroke="#287a91" stroke-width="3" marker-end="url(#arrow)"/><line x1="130" y1="215" x2="750" y2="270" stroke="#287a91" stroke-width="3" marker-end="url(#arrow)"/><text x="145" y="106" >Prvi bit kreće: 0</text><text x="770" y="177" >Prvi bit stiže: t_š</text><text x="145" y="239" >Posljednji bit kreće: t_sl</text><text x="605" y="304" >Posljednji bit stiže: t_sl + t_š</text><text x="370" y="132" font-size="16">putovanje prvog bita</text><text x="32" y="169" font-weight="bold">t_sl</text><path d="M110 115 H85 V215 H110" fill="none" stroke="#287a91" stroke-width="2"/><text x="30" y="356" font-size="16">Vrijeme teče prema dolje. Skica nije u mjerilu.</text></g></svg>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
<title id="title">Lokalna mreža s tri računala</title><desc id="desc">PC1 je povezan s Ethernet0, PC2 s Ethernet1, a PC3 s Ethernet2 preklopnika SW1. Sva računala imaju zadane adrese 192.168.10.1, 2 i 3 s maskom /24.</desc>
<rect width="1000" height="400" fill="white"/>
<g font-family="Arial,sans-serif" text-anchor="middle" fill="#071b50">
<g stroke="#287a91" stroke-width="4" fill="none"><path d="M220 110 H420 M580 110 H780 M500 160 V260"/></g>
<g fill="#e5f3f9" stroke="#287a91" stroke-width="2"><rect x="40" y="60" width="180" height="100" rx="12"/><rect x="780" y="60" width="180" height="100" rx="12"/><rect x="410" y="260" width="180" height="100" rx="12"/></g>
<rect x="420" y="60" width="160" height="100" rx="12" fill="#d6eee8" stroke="#287a91" stroke-width="2"/>
<g fill="#071b50"><rect x="414" y="101" width="12" height="18" rx="2"/><rect x="574" y="101" width="12" height="18" rx="2"/><rect x="491" y="154" width="18" height="12" rx="2"/></g>
<g font-size="25" font-weight="bold"><text x="130" y="106">PC1</text><text x="870" y="106">PC2</text><text x="500" y="306">PC3</text><text x="500" y="106">SW1</text></g>
<g font-size="17"><text x="130" y="135">VPCS</text><text x="870" y="135">VPCS</text><text x="500" y="335">VPCS</text><text x="500" y="135">Ethernet switch</text><text x="320" y="89">Ethernet0</text><text x="680" y="89">Ethernet1</text><text x="560" y="219">Ethernet2</text></g>
<g font-size="19"><text x="130" y="191">192.168.10.1/24</text><text x="870" y="191">192.168.10.2/24</text><text x="500" y="389">192.168.10.3/24</text></g>
</g></svg>
